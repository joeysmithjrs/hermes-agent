# PM Desk directive taxonomy — versioned.
#
# Each card is a bounded research directive, not a strategy and never an
# instruction to trade. The seed compiler selects a small, stratified, eligible
# subset per run; a card whose required capability the desk lacks is excluded
# with a stated reason rather than silently dropped.
#
# Every card inherits `live_execution` in its prohibits list. This desk is
# paper-only and has no code path that could act on a market.
#
# Bump `version` whenever card semantics change, so a recorded seed can be
# interpreted against the taxonomy that produced it.
#
# v2 (2026-07-31): agentic mid/low-cap seams over latency racing. Prefer
# fair-value, resolution mapping, post-print dislocation, intra-venue
# coherence, and scheduled (slow) primary sources. Cards may set `weight`
# (default 1) so the seed compiler up-weights judgment seams.
#
# v3 (2026-07-31): two changes.
#
#   `mission_eligible` marks the families that mean the same thing in every
#   arena, so a mission_x_arena morning can run one of them across several
#   sectors of the venue at once (see taxonomy/arenas.yaml).
#
#   `code_stat_exploit` admits that some seams are code, not prose. Their hot
#   path is a daemon or a repo watching a stream; Hermes wakes on a trigger or
#   reviews a build proposal, and does not re-derive the edge every morning
#   with an LLM. Those cards deliver a proposed_buildouts[] block, which the
#   provisioner never installs - Joe approves each one separately.

version: 3

families:
  # ---------------------------------------------------------------------------
  - id: fair_value_research
    title: Fair-value research (mid/low-cap)
    status: active
    paper_only: true
    always_reserve_slot: true
    # The default mission for a mission_x_arena morning: "find fair value in a
    # mid-cap market" means the same thing in pop culture as it does in macro.
    mission_eligible: true
    description: >
      Defensible fair value and kill conditions for mid/low-cap markets where
      judgment and structure beat speed. Not a race to first print.
    cards:
      - id: fair_value_long_tail
        title: Fair-value pack for a mid/low-cap market
        requires: [polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        weight: 3
        directive: >
          Pick a live mid/low-cap Polymarket with a roughly tradeable book (not a
          huge bid-ask hole; not mega-liquidity index beta). Extract rules, name
          the authentic primary fact, build a defensible fair-value estimate from
          base rates and comps, and state liquidity-aware edge only if the gap to
          mid exceeds half-spread plus buffer. Deliver kill conditions and slow
          monitors (calendar, HTTP source fingerprints) - not a sub-second race.
        deliverable: >
          A fair-value note with estimate, method, comps, size-aware edge
          predicate, kill list, and suggested monitor specs (minutes to days).

      - id: schedule_arity_calendar
        title: Scheduled resolving events calendar
        requires: [polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        weight: 2
        directive: >
          Map the next 2 to 6 weeks of scheduled events that resolve or heavily
          reprice open markets the desk can observe (stats prints, court dates,
          elections, award shows, filing deadlines). Choose one cluster and
          outline a fair-value prep pack rather than a latency sniper.
        deliverable: A short calendar plus one fair-value prep target with primary source.

  # ---------------------------------------------------------------------------
  - id: microstructure_event
    title: Post-print / event microstructure
    status: active
    paper_only: true
    mission_eligible: true
    description: >
      Harvest dislocations after a known public print or market move - fat
      fingers, sticky mids, peer lag. Intensity is event-window, not 24/7 race.
    cards:
      - id: post_print_dislocation
        title: Post-announcement book dislocation
        requires: [polymarket_public_data, local_evidence_store, paper_ledger]
        prohibits: [live_execution]
        weight: 2
        directive: >
          Identify a recent or imminent known T0 (release, ruling, official
          post). Design a 5 to 30 minute post-print protocol: which tokens to
          snapshot, what counts as fat-finger or inverted book or peer lag, and
          paper hold/exit rules. Do not propose continuous sub-minute CDN
          scraping as the whole edge.
        deliverable: >
          An event-window monitor pack (market_move and spread_widening rules plus
          T0 definition) and a paper response sketch.

  # ---------------------------------------------------------------------------
  - id: intra_poly_coherence
    title: Intra-Polymarket coherence
    status: active
    paper_only: true
    mission_eligible: true
    description: >
      Related contracts on Polymarket that should co-move or obey arithmetic or
      narrative consistency - flag stale or inconsistent mids for research.
    cards:
      - id: related_market_incoherence
        title: Related-market probability inconsistency
        requires: [polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        weight: 2
        directive: >
          Find a set of live related Polymarket questions (same entity, nested
          dates, multipath). Check whether mids are mutually coherent under
          simple bounds. If not, learn whether rules or liquidity explain the
          gap before claiming edge.
        deliverable: A coherence table and either a research thesis or a reject.

  # ---------------------------------------------------------------------------
  - id: primary_source_sniper
    title: Primary-source observation (scheduled / slow preferred)
    status: active
    paper_only: true
    mission_eligible: true
    description: >
      Authoritative publishers and fingerprintable sources. Prefer scheduled or
      machine-readable feeds. Pure ad-hoc CDN races on thin books are secondary.
    cards:
      - id: official_statistics_release
        title: Official statistics release
        requires: [primary_source_collection, polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        weight: 3
        directive: >
          Identify a scheduled statistical release (GDP, CPI, employment) whose
          exact published figure is the resolution criterion of a live market.
          Write a SourceSpec for the release page, confirm the market's rules
          text maps to that exact statistic and vintage, and record whether the
          release is scheduled or ad hoc.
        deliverable: A SourceSpec plus a rules-mapping note stating the exact figure and vintage.

      - id: court_docket_opinion
        title: Court docket or opinion
        requires: [primary_source_collection, polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        weight: 2
        directive: >
          Identify a public docket or opinions page that publishes the ruling a
          market resolves on. Establish whether the docket entry or the opinion
          text is authoritative for resolution, and how quickly each appears.
        deliverable: A SourceSpec plus a note on which artifact resolution actually keys on.

      - id: election_authority_result
        title: Election authority result
        requires: [primary_source_collection, polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        weight: 2
        directive: >
          Identify the official election authority result page named by a
          market's resolution source. Distinguish provisional from certified
          counts and record which one the market's rules text requires.
        deliverable: A SourceSpec plus a provisional-vs-certified mapping.

      - id: regulator_agency_notice
        title: Regulator or agency notice (fair value and calendar, not race)
        requires: [primary_source_collection, polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        weight: 1
        directive: >
          Identify a regulator notices page or Federal Register API friendly feed
          that can eventually decide a mid-cap market. Prefer machine feeds and
          HTML hubs over ad-hoc CDN PDF races. Emphasize fair-value and rules
          mapping; latency only if book depth justifies it. If the book is a
          puncture (huge spread, tiny depth), reject as race EV and reframe as
          slow monitor research only.
        deliverable: >
          SourceSpecs and cadence note plus liquidity-aware escalate or reject for race.

      - id: corporate_ir_filing
        title: Corporate IR or filing
        requires: [primary_source_collection, polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        weight: 2
        directive: >
          Identify a company's investor-relations or regulatory-filing page that
          publishes the disclosure a market resolves on. Record whether the
          filing index or the document itself changes first.
        deliverable: A SourceSpec plus a first-mover note between index and document.

  # ---------------------------------------------------------------------------
  - id: code_stat_exploit
    title: Code and statistical exploits (daemon-shaped)
    status: active
    paper_only: true
    description: >
      Seams that a program can hold and an LLM cannot: jump detection, streaming
      arithmetic bounds, timed state machines, calibration against history. The
      deliverable is a build proposal with an interface and a validation plan,
      not a narrative - because the honest version of this edge runs
      continuously in code, wakes Hermes on a trigger, and costs nothing when
      nothing happens. A card here that produces only prose has failed.
    cards:
      - id: jump_mean_reversion_daemon
        title: Jump detection and mean-reversion daemon
        requires: [polymarket_public_data, local_evidence_store, paper_ledger]
        prohibits: [live_execution]
        weight: 2
        directive: >
          Design a daemon that watches a defined universe of mid-cap tokens for
          discrete mid jumps and decides, in code, whether each jump is news or
          noise. Define the universe, the jump threshold and how it scales with
          the book, the false-positive policy, and the paper-only signal it
          emits. State precisely when the daemon should wake Hermes for
          fair-value or news judgement versus when it should record a paper
          observation and stay quiet. Quantify the expected wake rate; a daemon
          that pages every hour is a worse artifact than one that pages twice a
          week.
        deliverable: >
          A proposed_buildouts[] block (problem, interface, validation plan,
          spawn_recommendation, approval_required true) plus the wake policy.

      - id: streaming_coherence_bounds
        title: Streaming coherence bound checker
        requires: [polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        weight: 2
        directive: >
          Turn related-market arithmetic into a checker that runs continuously
          rather than a table an agent rebuilds each morning. Specify how sets
          of related contracts are discovered, which bounds hold (mutual
          exclusivity, nesting, sums), what tolerance separates a real breach
          from spread noise, and what evidence the checker stores so a breach
          can be argued about later. Say which breaches deserve a human look and
          which are structural and should be suppressed.
        deliverable: >
          A proposed_buildouts[] block with the bound definitions, tolerance
          policy and validation plan against stored observations.

      - id: post_print_state_machine
        title: Post-print window state machine
        requires: [polymarket_public_data, local_evidence_store, paper_ledger]
        prohibits: [live_execution]
        weight: 1
        directive: >
          Encode a known T0 (a scheduled release, a ruling, an official post) as
          a coded 5-to-30-minute state machine instead of an agent watching a
          clock. Define the states, the transitions and their triggers, what is
          snapshotted in each, and the exit conditions including the boring one
          where nothing dislocates. Be explicit that this is paper observation:
          the machine records, it does not act.
        deliverable: >
          A state-machine spec plus a proposed_buildouts[] block, and the
          monitor specs that arm it around the next scheduled T0.

      - id: nowcast_bucket_calibration
        title: Nowcast-to-bucket calibration
        requires: [polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        weight: 2
        directive: >
          For a bracketed statistical market, build the missing quantitative
          step: from a public nowcast or consensus to a probability per bucket,
          using the historical error distribution of that specific nowcast
          against that specific series. Name the vintages, measure the error
          (RMSE is a floor, not the answer - check bias and fat tails), and
          state the sample size honestly. If the history is too short to
          calibrate, that is the finding, and the market is not tradeable on
          this method.
        deliverable: >
          A calibration note with the error distribution, the resulting bucket
          probabilities, and a proposed_buildouts[] block for the code that
          would maintain it.

  # ---------------------------------------------------------------------------
  - id: resolution_oracle
    title: Resolution and oracle research
    status: active
    paper_only: true
    mission_eligible: true
    # Participation in UMA is a human decision with real economic stakes; the
    # desk researches resolution mechanics and stops there.
    human_only: [uma_propose_dispute]
    description: >
      Read rules text and designated resolution sources carefully enough to know
      how a market actually resolves. RESEARCH ONLY — proposing or disputing an
      UMA assertion is a human action this desk never takes or recommends taking
      automatically.
    cards:
      - id: rules_text_resolution_mapping
        title: Rules text to resolution-source mapping
        requires: [polymarket_public_data, local_evidence_store]
        prohibits: [live_execution, uma_propose_dispute]
        weight: 3
        directive: >
          For a live market, extract the rules text and the designated resolution
          source. State precisely what fact, from which publisher, at which
          vintage, decides the outcome — and list the ambiguities that could
          produce a contested resolution.
        deliverable: A rules-mapping note listing the deciding fact and every ambiguity found.

      - id: resolution_source_reachability
        title: Resolution source reachability
        requires: [polymarket_public_data, primary_source_collection, local_evidence_store]
        prohibits: [live_execution, uma_propose_dispute]
        weight: 2
        directive: >
          Check whether a market's designated resolution source is actually
          machine-observable from this desk. Use pm-desk collect for HTML or PDF
          with an explicit desk home and Browserbase when curl gets 403. Record
          barriers without bypassing logins or paywalls.
        deliverable: A reachability note; if a barrier remains after proper tools, stop.

      - id: ambiguity_bounty
        title: Ambiguity bounty (dual-path residual)
        requires: [polymarket_public_data, local_evidence_store]
        prohibits: [live_execution, uma_propose_dispute]
        weight: 2
        directive: >
          Hunt a market whose rules concede dual paths, fuzzy consensus language,
          or vintage traps. Document whether clarity research is the edge and what
          a human would need before any UMA action (desk never auto-proposes).
        deliverable: An ambiguity map with research-only next steps (human UMA gate).

  # ---------------------------------------------------------------------------
  - id: tool_and_build_proposals
    title: Tooling and datafeed build proposals
    status: active
    paper_only: true
    description: >
      Agents should think beyond today's tool grant. Propose code, CLIs, datafeeds,
      or a bounded Claude Code Pro buildout when that would unlock a testable seam —
      always as a permission-gated proposal to Joe, never auto-spawned.
    cards:
      - id: propose_datafeed_or_api
        title: Propose a datafeed or API integration
        requires: [polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        weight: 2
        directive: >
          Identify a public datafeed, API, filesystem artifact, or scraper seam
          that would materially improve fair-value or monitoring for a mid/low-cap
          market cluster. Write a BuildProposal: problem, proposed interface,
          cost/risk, validation plan, and whether Claude Code Pro should implement
          it after Joe approves. Do not implement without approval.
        deliverable: >
          A BuildProposal block suitable for ExecutionPlan.proposed_buildouts with
          approval_required true.

      - id: propose_research_harness
        title: Propose a research harness or mini-repo
        requires: [polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        weight: 1
        directive: >
          When an idea needs a throwaway backtest, coherence scorer, or one-off
          collector beyond desk helpers, propose a bounded harness or mini-repo
          (scope, acceptance tests, estimated effort, Claude Code Pro vs script).
          Joe must approve before any agent spawn or repo create.
        deliverable: A BuildProposal with spawn_recommendation none|claude_code_pro_after_approval.

  # ---------------------------------------------------------------------------
  - id: semantic_basis
    title: Cross-venue semantic basis
    status: deferred
    paper_only: true
    deferred_reason: >
      Requires a cross-venue entailment/compliance capability the desk does not
      have. Comparing two venues' contracts without verifying that their terms
      actually entail one another produces confident, wrong basis trades.
    requires_capability_to_activate: cross_venue_entailment
    cards:
      - id: cross_venue_contract_entailment
        title: Cross-venue contract entailment
        requires: [cross_venue_entailment, polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        directive: >
          For a pair of contracts on different venues, establish whether one
          strictly entails the other under all resolution paths, or merely
          correlates. Only entailment justifies treating the pair as a basis.
        deliverable: An entailment proof or a rejection with the divergent resolution path.

  # ---------------------------------------------------------------------------
  - id: wallet_skill
    title: Wallet skill attribution
    status: active
    paper_only: true
    description: >
      Study public trader behaviour as evidence about a market, on paper only.
      Copying a wallet without an independent thesis is prohibited: it inherits
      someone else's risk, sizing and information without any of their context.
    cards:
      - id: public_wallet_skill_attribution
        title: Public wallet skill attribution
        requires: [polymarket_public_data, local_evidence_store, paper_ledger]
        prohibits: [live_execution, blind_copy_execution]
        weight: 1
        directive: >
          Using public trade data only, assess whether a wallet's record on a
          market family reflects skill or variance. Separate sizing luck from
          edge, and state the sample size. Any resulting thesis must stand on its
          own evidence — never on the fact that a wallet took a position.
        deliverable: A skill-vs-variance note with sample size, and an independent thesis or none.

  # ---------------------------------------------------------------------------
  - id: neg_risk_mm
    title: Negative-risk market making
    status: deferred
    paper_only: true
    deferred_reason: >
      Deferred until later. Market making needs inventory, quoting and risk
      machinery that would have to sit outside an LLM path, and none of it is
      built. It is also the family least compatible with a paper-only desk.
    requires_capability_to_activate: neg_risk_market_making
    cards:
      - id: neg_risk_basket_coherence
        title: Negative-risk basket coherence
        requires: [neg_risk_market_making, polymarket_public_data]
        prohibits: [live_execution]
        directive: >
          Measure whether a negative-risk basket's legs sum coherently and how
          that coherence behaves through news.
        deliverable: A coherence measurement over time.

  # ---------------------------------------------------------------------------
  - id: explore_seed
    title: Exploration seed
    status: active
    paper_only: true
    # Always reserved a slot when budget allows, so the desk keeps sampling
    # outside whatever it happened to look at yesterday.
    always_reserve_slot: true
    description: >
      Deliberately push attention toward an eligible cluster the desk has not
      been working. Guards against a research loop that only ever deepens
      yesterday's thesis.
    cards:
      - id: unfamiliar_eligible_cluster
        title: Unfamiliar eligible cluster
        requires: [polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        weight: 2
        directive: >
          Pick a market cluster this desk has NOT recently stored observations or
          sources for, and that is still eligible under current capabilities.
          Characterise fair-value research fitness and what primary source would
          move first - prefer non latency-monopolised names.
        deliverable: A cluster characterisation naming the primary source that moves first.

      - id: unobserved_resolution_mechanism
        title: Unobserved resolution mechanism
        requires: [polymarket_public_data, local_evidence_store]
        prohibits: [live_execution]
        weight: 2
        directive: >
          Find a resolution mechanism the desk has no experience with, and
          document how it differs from the mechanisms already covered.
        deliverable: A mechanism note contrasting it with what the desk already handles.
