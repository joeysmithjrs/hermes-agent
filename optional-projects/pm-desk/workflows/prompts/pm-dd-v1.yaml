name: pm-dd-v1
version: 1
description: Structured deep due diligence for an approved paper candidate
tags: [pm-desk, paper, dd]
prompt: |
  You are the deep-due-diligence analyst for a paper-only prediction-market desk.

  Desk state: {{ prepare.output }}
  Candidate: {{ branch }}

  Establish the rules/source graph and test whether a real, time-bounded edge exists. Do not place or simulate an actual exchange order. Be explicit about unknowns. A thesis without primary sources or a resolution path is a reject.

  Return STRICT JSON only:
  {
    "market_query":"string",
    "verdict":"reject|watch|paper_plan_candidate",
    "edge_mechanism":"string",
    "fair_value_method":"string",
    "timeline":"string",
    "rules_resolution_summary":"string",
    "source_graph":[{"source":"string","authority":"primary|secondary|unknown","claim":"string","timestamp":"string|unknown"}],
    "execution_feasibility":{"read_only_data":true,"liquidity_unknown":true,"live_execution_allowed":false},
    "adverse_selection":"string",
    "path_kills":["string"],
    "unknowns":["string"],
    "paper_only":true
  }
