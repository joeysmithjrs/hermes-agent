# PM Desk — the morning generator. THIS is the workflow to run first.
#
#   prepare → seed → directive (fanout) → dq → dd → eval_debate → plan → paper_gate
#
# It turns a deterministic directive seed into ONE artifact: an ExecutionPlan.
# Joe approves or denies it in Telegram. On approval a deterministic provisioner
# — `pm-desk provision apply`, no agent — installs the monitors the plan
# describes as real Hermes cron jobs. That is the whole product loop:
#
#   generate → approve → provision → monitor → notify → record
#
# ---------------------------------------------------------------------------
# MODEL / SPEND TIER (Joe 2026-07-31)
#
# This is an experiment-grade morning run, not a thrift flash pass. Cap is
# elevated so promising edges are not starved mid-research. Roles are diverse
# on purpose (different labs/routers), with critical judgement on the
# terra / sonnet end of the catalog:
#
#   prepare      z-ai/glm-5.1              OR        cheap-strong context pack
#   directive×N  grok-4.5                  xai-oauth SuperGrok (NOT OpenRouter)
#   dq           gpt-5.6-terra             OR        hard filters (critical)
#   dd           moonshotai/kimi-k2.5      OR        long research + tools
#   eval_debate  glm + kimi + grok         mixed     adversarial council (tools empty)
#     risk       grok-4.5                  xai-oauth SuperGrok
#     judge      anthropic/claude-sonnet-5 OR        critical chair (critical)
#   plan         gpt-5.6-terra             OR        ExecutionPlan JSON (critical)
#
# Grok nodes MUST use provider: xai-oauth + bare model id `grok-4.5` so they
# bill SuperGrok subscription (hermes auth add xai-oauth). OpenRouter `x-ai/...`
# is a different route and should not be used for those nodes.
# Other nodes use openrouter. Bare terra ids follow local OR convention.
# ---------------------------------------------------------------------------
# WHY THE GRAPH IS STILL MOSTLY A STRAIGHT LINE
#
# Hermes stores agent output as {text, node, result, ...} with the model JSON
# as a STRING inside `text` — never parsed. So `condition:` on an agent edge and
# `over: "{{ agent.output.list }}"` both fail closed. The only fanout is over
# seed.directive_cards (real structured input from taxonomy compile).
# Diversity of *models* is expressed by pinning different models on successive
# nodes and on debate participants — not by branching on agent JSON fields.
# ---------------------------------------------------------------------------
# PAPER ONLY — no wallet / order / UMA path exists here.
# ---------------------------------------------------------------------------

workflow: pm_morning_generator_v0
name: PM Desk — morning generator (ExecutionPlan + approval gate)
version: 2

# Shared named workspace under $HERMES_HOME/workflows/workspaces/pm-desk/.
# NOT a bind of this package directory.
workspace: pm-desk

# Experiment budget: Joe is willing to spend for quality. Node caps below sum
# lower than this; the workflow-level ceiling is the hard kill switch.
max_budget_usd: 12.00

defaults:
  timeout_s: 900
  # Provider for every pinned model unless a node overrides.
  # (Nodes set model explicitly; provider repeated for clarity/isolation.)

nodes:
  # --- cheap-strong context pack (GLM) ------------------------------------
  - id: prepare
    kind: agent
    spec:
      model: z-ai/glm-5.1
      provider: openrouter
      prompt:
        library: pm-prepare-context-v1
      tools: [read_file, session_search]
      max_turns: 8
      budget_usd: 0.80

  # Cards compiled outside the workflow:
  #   pm-desk taxonomy compile --max-cards 4 --json > /tmp/seed.json
  - id: seed
    kind: script
    run: workflow.examples.echo
    idempotent: true
    input:
      directive_cards: '{{ input.directive_cards }}'
      seed: '{{ input.seed }}'

  # --- divergent ideation (Grok) — one branch per deterministic card ------
  # Tools: web + X + pm-desk helpers via terminal (discover markets, peek store).
  # No write_file/patch. Fanout still one model for all cards (Hermes limit).
  - id: directive
    kind: fanout
    over: '{{ seed.output.echo.directive_cards }}'
    max_branches: 4
    branch:
      kind: agent
      spec:
        model: grok-4.5
        provider: xai-oauth
        prompt:
          library: pm-directive-v1
          params:
            template: '{{ branch.card_id }}'
        tools:
          - web_search
          - web_extract
          - x_search
          - read_file
          - terminal
        max_turns: 14
        budget_usd: 1.40

  # --- hard DQ (Terra) — critical; open sources/markets before killing -----
  # Browserbase is NOT a workflow-native tool — it's a pm-desk CLI flag on
  # `source collect --live`. Hermes `browser_*` covers ordinary pages; PDFs
  # and hard CDN blocks may still need Browserbase via terminal + --home.
  - id: dq
    kind: agent
    spec:
      model: gpt-5.6-terra
      provider: openrouter
      prompt:
        library: pm-dq-v1
      tools:
        - web_search
        - web_extract
        - x_search
        - read_file
        - terminal
        - browser_navigate
        - browser_snapshot
        - browser_click
        - browser_scroll
      max_turns: 16
      budget_usd: 2.00

  # --- deep research (Kimi) — MUST verify markets + primary docs for real --
  # NOTE: spec.tools is a toolset subset grant, not a true ACL; sibling tools
  # in the same toolset may appear. No trading/signing tools exist in-package.
  - id: dd
    kind: agent
    spec:
      model: moonshotai/kimi-k2.5
      provider: openrouter
      prompt:
        library: pm-dd-v1
      tools:
        - web_search
        - web_extract
        - x_search
        - read_file
        - terminal
        - browser_navigate
        - browser_snapshot
        - browser_click
        - browser_scroll
      max_turns: 40
      budget_usd: 4.00

  # --- adversarial council (diverse) + Sonnet chair (critical) ------------
  # Replaces the single monolithic eval agent. Participants argue YES / NO /
  # RISK with empty tools; chair only runs if vote does not converge.
  - id: eval_debate
    kind: debate
    protocol: judge_escalate
    max_rounds: 2
    directive:
      topic: "Which paper thesis (if any) is worth packaging into an ExecutionPlan for Joe to approve this morning?"
      objective: >
        Prefer reject_all unless a survivor has a testable edge mechanism,
        named primary sources that DD actually verified with tools, a precise
        rules/resolution path, bounded horizon, and concrete monitor drafts.
        PAPER ONLY — no live execution language.
      vote_key: verdict
      threshold: 2
      judge_model: anthropic/claude-sonnet-5
      judge_provider: openrouter
      judge:
        id: chair
        kind: agent
        spec:
          model: anthropic/claude-sonnet-5
          provider: openrouter
          max_turns: 8
          budget_usd: 1.20
          tools: []
          prompt: |
            You are the desk chair. The council did not converge after the
            allowed rounds. PAPER ONLY desk — no orders, no wallets.

            Topic: {{ branch.topic }}
            Objective: {{ branch.objective }}
            Full transcript: {{ branch.transcript }}

            Desk context (prepare): {{ prepare.output }}
            DD dossiers: {{ dd.output }}

            Decide one of:
              - advance_one — name the single best thesis and why monitors can catch it
              - reject_all — nothing is monitor-ready this morning

            Prefer reject_all when evidence is thin, unverified, or retail-hopium.
            Respond with STRICT JSON only:
            {
              "verdict": "advance_one|reject_all",
              "selected_thesis": "string or empty",
              "rationale": "string",
              "monitor_bindings_hint": ["string"],
              "paper_only": true
            }
    participants:
      - id: bull
        kind: agent
        spec:
          model: z-ai/glm-5.1
          provider: openrouter
          max_turns: 8
          budget_usd: 0.70
          tools: []
          prompt: |
            You are the BULL on a PAPER-ONLY PM desk (round {{ branch.round }}/{{ branch.max_rounds }}).
            Make the strongest honest case that at least one DD survivor is
            worth installing monitors for — or admit the case is weak.

            Topic: {{ branch.topic }}
            Prepare: {{ prepare.output }}
            DD: {{ dd.output }}
            Prior rounds: {{ branch.transcript }}

            End with STRICT JSON:
            {"verdict":"advance_one|reject_all","thesis":"string","why":"string","paper_only":true}

      - id: bear
        kind: agent
        spec:
          model: moonshotai/kimi-k2.5
          provider: openrouter
          max_turns: 8
          budget_usd: 0.70
          tools: []
          prompt: |
            You are the BEAR / default-reject on a PAPER-ONLY PM desk
            (round {{ branch.round }}/{{ branch.max_rounds }}). Kill anything that
            lacks a verified primary source, precise rules path, or observable
            monitor. Most mornings should end reject_all.

            Topic: {{ branch.topic }}
            Prepare: {{ prepare.output }}
            DD: {{ dd.output }}
            Prior rounds: {{ branch.transcript }}

            End with STRICT JSON:
            {"verdict":"advance_one|reject_all","thesis":"string","why":"string","paper_only":true}

      - id: risk
        kind: agent
        spec:
          model: grok-4.5
          provider: xai-oauth
          max_turns: 8
          budget_usd: 0.70
          tools: []
          prompt: |
            You are the RISK officer on a PAPER-ONLY PM desk
            (round {{ branch.round }}/{{ branch.max_rounds }}). Ignore narrative charm.
            Score only: adverse selection, path kills, covariance with junk
            themes, spoiled thesis hashes, and whether monitors would actually
            fire on the right thing.

            Topic: {{ branch.topic }}
            Prepare: {{ prepare.output }}
            DD: {{ dd.output }}
            Prior rounds: {{ branch.transcript }}

            End with STRICT JSON:
            {"verdict":"advance_one|reject_all","thesis":"string","why":"string","paper_only":true}

  # --- package ExecutionPlan (Terra) — critical ---------------------------
  # real schema enforcement is still `pm-desk plan validate` after the run;
  # Hermes does not runtime-validate spec.output against model text.
  - id: plan
    kind: agent
    spec:
      model: gpt-5.6-terra
      provider: openrouter
      prompt:
        library: pm-execution-plan-v1
      tools: []
      max_turns: 12
      budget_usd: 1.50
      output:
        type: object
        required:
          - version
          - plan_id
          - paper_only
          - created_at
          - seed
          - thesis
          - research_summary
          - telegram_brief
          - approval
          - paper_only_constraints
        properties:
          version: { const: 1 }
          paper_only: { const: true }
          paper_only_constraints:
            type: object
            properties:
              live_execution_allowed: { const: false }
              fill_type_if_ledger: { const: SIMULATED_NO_FILL }

  - id: paper_gate
    kind: gate

edges:
  - { from: prepare, to: seed }
  - { from: seed, to: directive }
  - { from: directive, to: dq }
  - { from: dq, to: dd }
  - { from: dd, to: eval_debate }
  - { from: eval_debate, to: plan }
  - { from: plan, to: paper_gate }

gates:
  paper_gate:
    id: paper_gate
    channel: telegram
    approvers: [joe]
    dual_control: true
    on_timeout: shelve
    timeout_s: 86400

notify:
  on: [failed, partial, awaiting_gate]

triggers:
  # Manual until a real morning is watched end to end, then:
  #   hermes workflow schedule workflows/pm-morning-generator-v0.yaml \
  #     --cron '0 9 * * *' --input "$(cat /tmp/seed-wrapped.json)"
  - { kind: manual }
