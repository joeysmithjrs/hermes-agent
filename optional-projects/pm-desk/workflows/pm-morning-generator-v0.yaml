# PM Desk — the morning generator. THIS is the workflow to run first.
#
#   prepare → seed → directive (fanout) → dq → dd → eval_debate → plan → paper_gate
#
# It turns a deterministic directive seed into ONE artifact: an ExecutionPlan.
# Joe approves or denies it in Telegram. On approval a deterministic provisioner
# — `pm-desk provision apply`, no agent — installs the monitors the plan
# describes as real Hermes cron jobs. That is the whole product loop:
#
#   generate → approve → provision → monitor → notify → record
#
# ---------------------------------------------------------------------------
# MODEL / SPEND TIER (cost-controlled; 2026-08-02)
#
# The former experiment-grade graph spent an unbounded SuperGrok quota: four
# Grok directive scouts plus a Grok risk voter, each with X search and full
# browser tooling, and a two-round three-member council. That is the expensive
# failure mode. This production default is deliberately narrow:
#
#   prepare      z-ai/glm-5.2              OR        local context / dedupe
#   directive×2  z-ai/glm-5.2              OR        bounded scouting
#   dq + dd      z-ai/glm-5.2              OR        sequential evidence gate
#   eval_debate  GLM bull + Kimi bear      OR        one round; no chair by default
#   plan         openai/gpt-5.4-mini       OR        compact schema packaging
#
# Escalate manually to a separate deep-review run only when this workflow
# produces a single monitor-ready survivor. The global GPT-5.4 fallback is for
# provider/model failures, not a routine expensive second opinion. x_search is
# intentionally omitted while the xAI account is rate-limited; web_search and
# primary sources remain available.
# ---------------------------------------------------------------------------
# SEED MODE (Joe 2026-07-31) — mission_x_arena
#
# Compile the cards OUTSIDE the workflow, one mission across N arenas:
#
#   npx tsx src/cli/pm-desk.ts taxonomy compile \
#     --mode mission_x_arena --max-cards 3 --json > /tmp/seed.json
#
# Every card then carries mission_card_id, arena_id, arena_label and the arena's
# discover filters, and its directive ends in a hard arena scope block. The
# fanout below gives each branch one card, so the branches share a method and
# differ only in where they look - which is the whole point: four unrelated
# families produced four incomparable notes and a debate with nothing to rank.
#
# `--mode stratify_families` (the v2 behaviour, one card per family) is still
# there for a breadth survey, and `--include-explore` trades one arena slot for
# an exploration card. Neither is the default morning.
# ---------------------------------------------------------------------------
# WHY THE GRAPH IS STILL MOSTLY A STRAIGHT LINE
#
# Hermes stores agent output as {text, node, result, ...} with the model JSON
# as a STRING inside `text` — never parsed. So `condition:` on an agent edge and
# `over: "{{ agent.output.list }}"` both fail closed. The only fanout is over
# seed.directive_cards (real structured input from taxonomy compile).
# Diversity of *models* is expressed by pinning different models on successive
# nodes and on debate participants — not by branching on agent JSON fields.
# ---------------------------------------------------------------------------
# WORKSPACE (persistent across mornings)
#
# Top-level `workspace: pm-desk` pins every agent node to the named directory
#   $HERMES_HOME/workflows/workspaces/pm-desk/
# Layout Hermes creates:
#   <dir>/                 # durable across runs (seed notes, living desk state)
#   <dir>/runs/<run_id>/   # this morning's scratch + required stage artifacts
# Agents get `{{ workspace.dir }}`, `{{ workspace.run_dir }}`, `{{ workspace.files }}`,
# `{{ workspace.previous_runs }}` in prompts AND in delegate context. They MUST
# write stage JSON into run_dir with write_file so later stages can re-open
# evidence instead of trusting envelope text alone.
# ---------------------------------------------------------------------------
# PAPER ONLY — no wallet / order / UMA path exists here.
# ---------------------------------------------------------------------------

workflow: pm_morning_generator_v0
name: PM Desk — morning generator (ExecutionPlan + approval gate)
version: 3

# Shared named workspace under $HERMES_HOME/workflows/workspaces/pm-desk/.
# NOT a bind of this package directory.
workspace: pm-desk

# Hard run circuit breaker. The old graph had no dollar ceiling, so a retry or
# verbose tool loop could consume subscription quota without a stop condition.
# $3 is enough for the bounded primary pass; deeper review is an explicit
# separate decision, not an accidental retry.
max_budget_usd: 3.00

defaults:
  timeout_s: 600
  # Provider for every pinned model unless a node overrides.
  # (Nodes set model explicitly; provider repeated for clarity/isolation.)

# Reused tool grants (YAML anchors). The primary morning pass uses the public
# web and workspace evidence only. X is a high-volume optional signal source,
# not a dependency; it stays out until its account is healthy and a separately
# budgeted deep-review run explicitly needs it. Browser/terminal tool loops are
# also withheld from routine scouts; only DD may re-open a blocked primary
# source through the package CLI.
x-scout-tools: &scout_tools
  - web_search
  - web_extract
  - read_file
  - write_file

x-dd-tools: &dd_tools
  - web_search
  - web_extract
  - read_file
  - write_file
  - terminal
  - browser_navigate
  - browser_snapshot
  - browser_click
  - browser_scroll

x-context-tools: &context_tools
  - read_file
  - write_file
  - session_search

x-plan-tools: &plan_tools
  - read_file
  - write_file

nodes:
  # --- cheap-strong context pack (GLM) ------------------------------------
  - id: prepare
    kind: agent
    spec:
      model: z-ai/glm-5.2
      provider: openrouter
      prompt:
        library: pm-prepare-context-v1
      tools: *context_tools
  # Cards compiled outside the workflow:
  #   pm-desk taxonomy compile --mode mission_x_arena --max-cards 2 --json
  - id: seed
    kind: script
    run: workflow.examples.echo
    idempotent: true
    input:
      directive_cards: '{{ input.directive_cards }}'
      seed: '{{ input.seed }}'

  # --- one mission, one arena per branch (bounded GLM scouts) -------------
  # Routine scouts use public web plus workspace artifacts only. Their job is
  # to produce a terse, source-linked candidate note—not recursively research
  # every lead. Tool-heavy source recovery happens once in DD, after DQ.
  #
  # The branch prompt reads `{{ branch.directive }}` and `{{ branch.arena_label }}`
  # off the card itself; `params.template` is only the card id, used for the
  # artifact filename. Both fields exist on every card in every seed mode, so a
  # stratify_families seed renders through the same prompt without failing.
  - id: directive
    kind: fanout
    over: '{{ seed.output.echo.directive_cards }}'
    max_branches: 2
    branch:
      kind: agent
      spec:
        model: z-ai/glm-5.2
        provider: openrouter
        prompt:
          library: pm-directive-v1
          params:
            template: '{{ branch.card_id }}'
        tools: *scout_tools
  # --- hard DQ (GLM) — kill thin leads before expensive recovery -----------
  - id: dq
    kind: agent
    spec:
      model: z-ai/glm-5.2
      provider: openrouter
      prompt:
        library: pm-dq-v1
      tools: *scout_tools
  # --- focused DD (GLM) — one source-recovery pass after DQ ----------------
  # Browserbase is only reachable through the package CLI / terminal here and
  # is reserved for a blocked primary source, not general browsing.
  - id: dd
    kind: agent
    spec:
      model: z-ai/glm-5.2
      provider: openrouter
      prompt:
        library: pm-dd-v1
      tools: *dd_tools
  # --- one-round adversarial review; no premium chair in the default path ---
  - id: eval_debate
    kind: debate
    protocol: vote
    max_rounds: 1
    directive:
      topic: "Which paper thesis (if any) is worth packaging into an ExecutionPlan for Joe to approve this morning?"
      objective: >
        Prefer reject_all unless a survivor has a testable edge mechanism,
        named primary sources that DD actually verified with tools, a precise
        rules/resolution path, bounded horizon, and concrete monitor drafts.
        Re-check workspace artifacts and the live data plane before trusting
        or overturning upstream kill reasons. PAPER ONLY — no live execution.
      vote_key: verdict
      threshold: 2
    participants:
      - id: bull
        kind: agent
        spec:
          model: z-ai/glm-5.2
          provider: openrouter
          tools: *scout_tools
          prompt: |
            You are the BULL on a PAPER-ONLY PM desk (round {{ branch.round }}/{{ branch.max_rounds }}).
            Make the strongest honest case that at least one DD survivor is
            worth installing monitors for — or admit the case is weak.

            WORKSPACE (persistent across mornings):
              dir={{ workspace.dir }}
              run_dir={{ workspace.run_dir }}
              previous_runs={{ workspace.previous_runs }}
              files={{ workspace.files }}

            Topic: {{ branch.topic }}
            Prepare: {{ prepare.output }}
            DD: {{ dd.output }}
            Prior rounds: {{ branch.transcript }}

            Do NOT argue only from envelope text. Before voting:
            - read_file candidates / dq.json / dd.json under {{ workspace.run_dir }}
            - if bull case needs a fact re-check, use web/browser/terminal
              (pm-desk --home {{ workspace.run_dir }}/desk-home)
            - write_file {{ workspace.run_dir }}/eval_bull_r{{ branch.round }}.json

            End with STRICT JSON:
            {"verdict":"advance_one|reject_all","thesis":"string","why":"string","checks_run":["string"],"paper_only":true}

      - id: bear
        kind: agent
        spec:
          model: moonshotai/kimi-k2.5
          provider: openrouter
          tools: *scout_tools
          prompt: |
            You are the BEAR / default-reject on a PAPER-ONLY PM desk
            (round {{ branch.round }}/{{ branch.max_rounds }}). Kill anything that
            lacks a verified primary source, precise rules path, or observable
            monitor. Most mornings should end reject_all — but kill for thesis
            reasons, not because you refused to open the workspace or data plane.

            WORKSPACE:
              dir={{ workspace.dir }}
              run_dir={{ workspace.run_dir }}
              previous_runs={{ workspace.previous_runs }}

            Topic: {{ branch.topic }}
            Prepare: {{ prepare.output }}
            DD: {{ dd.output }}
            Prior rounds: {{ branch.transcript }}

            Before voting: read workspace stage JSON; re-verify contested
            sources/markets with tools; write_file
            {{ workspace.run_dir }}/eval_bear_r{{ branch.round }}.json

            End with STRICT JSON:
            {"verdict":"advance_one|reject_all","thesis":"string","why":"string","checks_run":["string"],"paper_only":true}

  # --- compact ExecutionPlan packaging; no new research in this stage -------
  # Schema enforcement still pairs with `pm-desk plan validate` after the run.
  - id: plan
    kind: agent
    spec:
      model: openai/gpt-5.4-mini
      provider: openrouter
      prompt:
        library: pm-execution-plan-v1
      tools: *plan_tools
      output:
        type: object
        required:
          - version
          - plan_id
          - paper_only
          - created_at
          - seed
          - thesis
          - research_summary
          - telegram_brief
          - approval
          - paper_only_constraints
        properties:
          version: { const: 1 }
          paper_only: { const: true }
          paper_only_constraints:
            type: object
            properties:
              live_execution_allowed: { const: false }
              fill_type_if_ledger: { const: SIMULATED_NO_FILL }

  - id: paper_gate
    kind: gate

edges:
  - { from: prepare, to: seed }
  - { from: seed, to: directive }
  - { from: directive, to: dq }
  - { from: dq, to: dd }
  - { from: dd, to: eval_debate }
  - { from: eval_debate, to: plan }
  - { from: plan, to: paper_gate }

gates:
  paper_gate:
    id: paper_gate
    channel: telegram
    approvers: [joe]
    dual_control: true
    on_timeout: shelve
    timeout_s: 86400

notify:
  on: [failed, partial, awaiting_gate]

triggers:
  # Manual until a real morning is watched end to end, then:
  #   hermes workflow schedule workflows/pm-morning-generator-v0.yaml \
  #     --cron '0 9 * * *' --input "$(cat /tmp/seed-wrapped.json)"
  - { kind: manual }
