# PM Desk — the morning generator. THIS is the workflow to run first.
#
#   prepare → seed → directive (fanout) → dq → dd → eval_debate → plan → paper_gate
#
# It turns a deterministic directive seed into ONE artifact: an ExecutionPlan.
# Joe approves or denies it in Telegram. On approval a deterministic provisioner
# — `pm-desk provision apply`, no agent — installs the monitors the plan
# describes as real Hermes cron jobs. That is the whole product loop:
#
#   generate → approve → provision → monitor → notify → record
#
# ---------------------------------------------------------------------------
# MODEL / SPEND TIER (Joe 2026-07-31)
#
# Experiment-grade morning: make it work first, optimize cost later.
# No per-agent max_turns / budget_usd. Roles are diverse on purpose
# (different labs/routers), critical judgement on terra / sonnet:
#
#   prepare      z-ai/glm-5.1              OR        cheap-strong context pack
#   directive×N  grok-4.5                  xai-oauth SuperGrok (NOT OpenRouter)
#   dq           gpt-5.6-terra             OR        hard filters (critical)
#   dd           moonshotai/kimi-k2.5      OR        long research + tools
#   eval_debate  glm + kimi + grok         mixed     council WITH scout tools
#     risk       grok-4.5                  xai-oauth SuperGrok
#     judge      anthropic/claude-sonnet-5 OR        critical chair (critical)
#   plan         gpt-5.6-terra             OR        ExecutionPlan JSON (critical)
#
# Grok nodes MUST use provider: xai-oauth + bare model id `grok-4.5` so they
# bill SuperGrok subscription (hermes auth add xai-oauth). OpenRouter `x-ai/...`
# is a different route and should not be used for those nodes.
# Other nodes use openrouter. Bare terra ids follow local OR convention.
# ---------------------------------------------------------------------------
# SEED MODE (Joe 2026-07-31) — mission_x_arena
#
# Compile the cards OUTSIDE the workflow, one mission across N arenas:
#
#   npx tsx src/cli/pm-desk.ts taxonomy compile \
#     --mode mission_x_arena --max-cards 3 --json > /tmp/seed.json
#
# Every card then carries mission_card_id, arena_id, arena_label and the arena's
# discover filters, and its directive ends in a hard arena scope block. The
# fanout below gives each branch one card, so the branches share a method and
# differ only in where they look - which is the whole point: four unrelated
# families produced four incomparable notes and a debate with nothing to rank.
#
# `--mode stratify_families` (the v2 behaviour, one card per family) is still
# there for a breadth survey, and `--include-explore` trades one arena slot for
# an exploration card. Neither is the default morning.
# ---------------------------------------------------------------------------
# WHY THE GRAPH IS STILL MOSTLY A STRAIGHT LINE
#
# Hermes stores agent output as {text, node, result, ...} with the model JSON
# as a STRING inside `text` — never parsed. So `condition:` on an agent edge and
# `over: "{{ agent.output.list }}"` both fail closed. The only fanout is over
# seed.directive_cards (real structured input from taxonomy compile).
# Diversity of *models* is expressed by pinning different models on successive
# nodes and on debate participants — not by branching on agent JSON fields.
# ---------------------------------------------------------------------------
# WORKSPACE (persistent across mornings)
#
# Top-level `workspace: pm-desk` pins every agent node to the named directory
#   $HERMES_HOME/workflows/workspaces/pm-desk/
# Layout Hermes creates:
#   <dir>/                 # durable across runs (seed notes, living desk state)
#   <dir>/runs/<run_id>/   # this morning's scratch + required stage artifacts
# Agents get `{{ workspace.dir }}`, `{{ workspace.run_dir }}`, `{{ workspace.files }}`,
# `{{ workspace.previous_runs }}` in prompts AND in delegate context. They MUST
# write stage JSON into run_dir with write_file so later stages can re-open
# evidence instead of trusting envelope text alone.
# ---------------------------------------------------------------------------
# PAPER ONLY — no wallet / order / UMA path exists here.
# ---------------------------------------------------------------------------

workflow: pm_morning_generator_v0
name: PM Desk — morning generator (ExecutionPlan + approval gate)
version: 3

# Shared named workspace under $HERMES_HOME/workflows/workspaces/pm-desk/.
# NOT a bind of this package directory.
workspace: pm-desk

# No per-node turn/budget caps (Joe: make it work first; SuperGrok absorbs Grok).
# Optional workflow ceiling left unset — do not thrift-starve research mornings.

defaults:
  timeout_s: 900
  # Provider for every pinned model unless a node overrides.
  # (Nodes set model explicitly; provider repeated for clarity/isolation.)

# Reused tool grants (YAML anchors). Scout stages + debate council share the
# same research surface so the council can re-check markets/sources instead of
# rubber-stamping DD prose. write_file is workspace-artifact only (prompt law).
x-scout-tools: &scout_tools
  - web_search
  - web_extract
  - x_search
  - read_file
  - write_file
  - terminal
  - browser_navigate
  - browser_snapshot
  - browser_click
  - browser_scroll

x-context-tools: &context_tools
  - read_file
  - write_file
  - session_search

x-plan-tools: &plan_tools
  - read_file
  - write_file

nodes:
  # --- cheap-strong context pack (GLM) ------------------------------------
  - id: prepare
    kind: agent
    spec:
      model: z-ai/glm-5.1
      provider: openrouter
      prompt:
        library: pm-prepare-context-v1
      tools: *context_tools
  # Cards compiled outside the workflow:
  #   pm-desk taxonomy compile --mode mission_x_arena --max-cards 3 --json
  - id: seed
    kind: script
    run: workflow.examples.echo
    idempotent: true
    input:
      directive_cards: '{{ input.directive_cards }}'
      seed: '{{ input.seed }}'

  # --- one mission, one arena per branch (Grok) ---------------------------
  # Tools: web + X + pm-desk helpers via terminal (discover markets, peek store)
  # + write_file into the shared workspace run_dir.
  #
  # The branch prompt reads `{{ branch.directive }}` and `{{ branch.arena_label }}`
  # off the card itself; `params.template` is only the card id, used for the
  # artifact filename. Both fields exist on every card in every seed mode, so a
  # stratify_families seed renders through the same prompt without failing.
  - id: directive
    kind: fanout
    over: '{{ seed.output.echo.directive_cards }}'
    max_branches: 4
    branch:
      kind: agent
      spec:
        model: grok-4.5
        provider: xai-oauth
        prompt:
          library: pm-directive-v1
          params:
            template: '{{ branch.card_id }}'
        tools: *scout_tools
  # --- hard DQ (Terra) — critical; open sources/markets before killing -----
  # Browserbase is NOT a workflow-native tool — it's a pm-desk CLI flag on
  # `source collect --live`. Hermes `browser_*` covers ordinary pages; PDFs
  # and hard CDN blocks may still need Browserbase via terminal + --home.
  - id: dq
    kind: agent
    spec:
      model: gpt-5.6-terra
      provider: openrouter
      prompt:
        library: pm-dq-v1
      tools: *scout_tools
  # --- deep research (Kimi) — MUST verify markets + primary docs for real --
  # NOTE: spec.tools is a toolset subset grant, not a true ACL; sibling tools
  # in the same toolset may appear. No trading/signing tools exist in-package.
  - id: dd
    kind: agent
    spec:
      model: moonshotai/kimi-k2.5
      provider: openrouter
      prompt:
        library: pm-dd-v1
      tools: *scout_tools
  # --- adversarial council (diverse) + Sonnet chair (critical) ------------
  # Same tool surface as DQ/DD so the council can re-open workspace artifacts,
  # markets, and primary sources instead of arguing only from envelope text.
  - id: eval_debate
    kind: debate
    protocol: judge_escalate
    max_rounds: 2
    directive:
      topic: "Which paper thesis (if any) is worth packaging into an ExecutionPlan for Joe to approve this morning?"
      objective: >
        Prefer reject_all unless a survivor has a testable edge mechanism,
        named primary sources that DD actually verified with tools, a precise
        rules/resolution path, bounded horizon, and concrete monitor drafts.
        Re-check workspace artifacts and the live data plane before trusting
        or overturning upstream kill reasons. PAPER ONLY — no live execution.
      vote_key: verdict
      threshold: 2
      judge_model: anthropic/claude-sonnet-5
      judge_provider: openrouter
      judge:
        id: chair
        kind: agent
        spec:
          model: anthropic/claude-sonnet-5
          provider: openrouter
          tools: *scout_tools
          prompt: |
            You are the desk chair. The council did not converge after the
            allowed rounds. PAPER ONLY desk — no orders, no wallets.

            WORKSPACE (persistent):
              name: {{ workspace.name }}
              dir:  {{ workspace.dir }}
              this run: {{ workspace.run_dir }}
              prior runs: {{ workspace.previous_runs }}
              top-level files: {{ workspace.files }}

            Topic: {{ branch.topic }}
            Objective: {{ branch.objective }}
            Full transcript: {{ branch.transcript }}

            Desk context (prepare): {{ prepare.output }}
            DD dossiers: {{ dd.output }}

            Before deciding, use tools:
            1. read_file under {{ workspace.run_dir }}/ (desk_state, candidates,
               dq.json, dd.json, any council notes).
            2. If a kill rests on "no market / PDF unreachable", re-run pm-desk
               discover/snapshot and Browserbase collect with
               DESK_HOME={{ workspace.run_dir }}/desk-home before agreeing.
            3. write_file your decision to
               {{ workspace.run_dir }}/eval_chair.json

            Decide one of:
              - advance_one — name the single best thesis and why monitors can catch it
              - reject_all — nothing is monitor-ready this morning

            Prefer reject_all when evidence is thin, unverified, or retail-hopium.
            Respond with STRICT JSON only:
            {
              "verdict": "advance_one|reject_all",
              "selected_thesis": "string or empty",
              "rationale": "string",
              "monitor_bindings_hint": ["string"],
              "checks_run": ["string"],
              "workspace_artifacts_read": ["string"],
              "paper_only": true
            }
    participants:
      - id: bull
        kind: agent
        spec:
          model: z-ai/glm-5.1
          provider: openrouter
          tools: *scout_tools
          prompt: |
            You are the BULL on a PAPER-ONLY PM desk (round {{ branch.round }}/{{ branch.max_rounds }}).
            Make the strongest honest case that at least one DD survivor is
            worth installing monitors for — or admit the case is weak.

            WORKSPACE (persistent across mornings):
              dir={{ workspace.dir }}
              run_dir={{ workspace.run_dir }}
              previous_runs={{ workspace.previous_runs }}
              files={{ workspace.files }}

            Topic: {{ branch.topic }}
            Prepare: {{ prepare.output }}
            DD: {{ dd.output }}
            Prior rounds: {{ branch.transcript }}

            Do NOT argue only from envelope text. Before voting:
            - read_file candidates / dq.json / dd.json under {{ workspace.run_dir }}
            - if bull case needs a fact re-check, use web/browser/terminal
              (pm-desk --home {{ workspace.run_dir }}/desk-home)
            - write_file {{ workspace.run_dir }}/eval_bull_r{{ branch.round }}.json

            End with STRICT JSON:
            {"verdict":"advance_one|reject_all","thesis":"string","why":"string","checks_run":["string"],"paper_only":true}

      - id: bear
        kind: agent
        spec:
          model: moonshotai/kimi-k2.5
          provider: openrouter
          tools: *scout_tools
          prompt: |
            You are the BEAR / default-reject on a PAPER-ONLY PM desk
            (round {{ branch.round }}/{{ branch.max_rounds }}). Kill anything that
            lacks a verified primary source, precise rules path, or observable
            monitor. Most mornings should end reject_all — but kill for thesis
            reasons, not because you refused to open the workspace or data plane.

            WORKSPACE:
              dir={{ workspace.dir }}
              run_dir={{ workspace.run_dir }}
              previous_runs={{ workspace.previous_runs }}

            Topic: {{ branch.topic }}
            Prepare: {{ prepare.output }}
            DD: {{ dd.output }}
            Prior rounds: {{ branch.transcript }}

            Before voting: read workspace stage JSON; re-verify contested
            sources/markets with tools; write_file
            {{ workspace.run_dir }}/eval_bear_r{{ branch.round }}.json

            End with STRICT JSON:
            {"verdict":"advance_one|reject_all","thesis":"string","why":"string","checks_run":["string"],"paper_only":true}

      - id: risk
        kind: agent
        spec:
          model: grok-4.5
          provider: xai-oauth
          tools: *scout_tools
          prompt: |
            You are the RISK officer on a PAPER-ONLY PM desk
            (round {{ branch.round }}/{{ branch.max_rounds }}). Ignore narrative charm.
            Score only: adverse selection, path kills, covariance with junk
            themes, spoiled thesis hashes, and whether monitors would actually
            fire on the right thing.

            WORKSPACE:
              dir={{ workspace.dir }}
              run_dir={{ workspace.run_dir }}
              previous_runs={{ workspace.previous_runs }}

            Topic: {{ branch.topic }}
            Prepare: {{ prepare.output }}
            DD: {{ dd.output }}
            Prior rounds: {{ branch.transcript }}

            Re-open workspace artifacts and, if needed, live sources before you
            path-kill. write_file
            {{ workspace.run_dir }}/eval_risk_r{{ branch.round }}.json

            End with STRICT JSON:
            {"verdict":"advance_one|reject_all","thesis":"string","why":"string","checks_run":["string"],"paper_only":true}

  # --- package ExecutionPlan (Terra) — critical ---------------------------
  # Plan may read/write workspace artifacts but does not re-research the book.
  # Schema enforcement still pairs with `pm-desk plan validate` after the run.
  - id: plan
    kind: agent
    spec:
      model: gpt-5.6-terra
      provider: openrouter
      prompt:
        library: pm-execution-plan-v1
      tools: *plan_tools
      output:
        type: object
        required:
          - version
          - plan_id
          - paper_only
          - created_at
          - seed
          - thesis
          - research_summary
          - telegram_brief
          - approval
          - paper_only_constraints
        properties:
          version: { const: 1 }
          paper_only: { const: true }
          paper_only_constraints:
            type: object
            properties:
              live_execution_allowed: { const: false }
              fill_type_if_ledger: { const: SIMULATED_NO_FILL }

  - id: paper_gate
    kind: gate

edges:
  - { from: prepare, to: seed }
  - { from: seed, to: directive }
  - { from: directive, to: dq }
  - { from: dq, to: dd }
  - { from: dd, to: eval_debate }
  - { from: eval_debate, to: plan }
  - { from: plan, to: paper_gate }

gates:
  paper_gate:
    id: paper_gate
    channel: telegram
    approvers: [joe]
    dual_control: true
    on_timeout: shelve
    timeout_s: 86400

notify:
  on: [failed, partial, awaiting_gate]

triggers:
  # Manual until a real morning is watched end to end, then:
  #   hermes workflow schedule workflows/pm-morning-generator-v0.yaml \
  #     --cron '0 9 * * *' --input "$(cat /tmp/seed-wrapped.json)"
  - { kind: manual }
